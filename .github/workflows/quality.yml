name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build

  node:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_INTEGRATION: "true"
    defaults:
      run:
        working-directory: backend/node-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/node-service/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test

  python:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET_KEY: test-session-secret-32-characters-long
      STEAM_API_KEY: test-steam-api-key
      INTERNAL_SERVICE_SECRET: test-internal-secret-32-characters-long
      CREDENTIAL_ENCRYPTION_KEY: test-credential-secret-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: pipx run --spec pip-audit==2.10.1 pip-audit -r backend/requirements-dev.txt --disable-pip --no-deps
      - run: ruff check backend/app backend/tests --select E9,F63,F7,F82
      - run: pytest -q backend/tests

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/go-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go-service/go.mod
          cache-dependency-path: backend/go-service/go.sum
      - run: go test ./...
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go-service/go.mod
          cache-dependency-path: backend/go-service/go.sum
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --config .gitleaks.toml --redact --no-banner
