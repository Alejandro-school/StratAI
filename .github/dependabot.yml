version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/frontend", "/backend/node-service"]
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /backend/go-service
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
